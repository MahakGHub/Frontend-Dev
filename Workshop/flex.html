<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
   .face {
      width: 200px;
      height: 200px;
      background: yellow;
      border-radius: 50%;
      position: relative;
      margin: 50px auto;
    }
    .eye {
      width: 25px;
      height: 35px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 60px;
      border:2px solid black;
    }
     .eye.left {
      left: 55px;
    }

    .eye.right {
      right: 55px;
    }
    
    .pupil {
      width: 5px;
      height: 5px;
      background: black;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    
    .mouth {
      width: 100px;
      height: 20px;
      background: red;
position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 5px;
      border: 2px solid black;
    }
    
    </style>
</head>
  <body>

  <div class="face">
      
    <div class="eye left">
    <div class="pupil"></div>
    </div>
    <div class="eye right">
      <div class="pupil"></div>
    </div>
    <div class="mouth"></div>
  </div>
</body>
</html>
