<!DOCTYPE html>
<html>
<head><title>Secure Form</title></head>
<body>

<form autocomplete="off">
    Username: <input type="text" required><br><br>
    Password: <input type="password" required><br><br>
    <button type="submit">Submit</button>
</form>

<p>Turning off autocomplete helps prevent browsers from storing sensitive information.</p>

</body>
</html>
